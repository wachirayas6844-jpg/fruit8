<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ AI Image Checker สุดคิ้วท์ ✨</title>
    <!-- นำเข้าฟอนต์ภาษาไทยน่ารักๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffeef8 0%, #fff5eb 50%, #f3e8ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #5c4b51;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 440px;
            border-radius: 30px;
            padding: 35px 30px;
            box-shadow: 0 15px 35px rgba(255, 133, 162, 0.18);
            border: 2px solid #ffffff;
            text-align: center;
        }

        h2 {
            color: #ff6b9d;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #9e8a92;
            margin-bottom: 20px;
        }

        /* สถานะการโหลดโมเดล */
        #status-badge {
            font-size: 13px;
            background: #fff3cd;
            color: #856404;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid #ffeeba;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff85a2, #ff6b9d);
            color: white;
            padding: 13px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.35);
            transition: all 0.25s ease;
        }

        .upload-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 157, 0.45);
        }

        #image-container {
            margin: 20px auto 0;
            width: 200px;
            height: 200px;
            border-radius: 24px;
            border: 3px dashed #ffc2d4;
            background-color: #fff9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #placeholder-text {
            color: #d4a5b5;
            font-size: 13px;
            padding: 15px;
        }

        #previewImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #resultSummary {
            display: none;
            margin-top: 20px;
            padding: 14px 18px;
            background: linear-gradient(135deg, #fff0f5, #ffe4ec);
            border: 2px solid #ffb3c6;
            border-radius: 20px;
            color: #d6336c;
            font-size: 17px;
            font-weight: 600;
            box-shadow: 0 6px 15px rgba(255, 179, 198, 0.25);
        }

        #label-container {
            margin-top: 18px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .prediction-item {
            background: #fffafb;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid #ffe3ec;
        }

        .prediction-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #6d5960;
        }

        .progress-bg {
            width: 100%;
            height: 7px;
            background-color: #ffe3ec;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9ebb, #ff6b9d);
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s ease-out;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌸 AI เช็กรูปภาพสุดคิ้วท์ 🌸</h2>
        <p class="subtitle">เลือกรูปภาพเพื่อให้น้อง AI ตรวจสอบกันเลย!</p>

        <!-- แสดงสถานะการโหลดโมเดล -->
        <div id="status-badge">⏳ กำลังโหลดโมเดล AI...</div>
        <br>

        <!-- ปุ่มอัปโหลดรูปภาพ -->
        <label for="imageInput" class="upload-btn" id="uploadBtnLabel" style="opacity: 0.5; pointer-events: none;">
            📸 เลือกรูปภาพตรงนี้เลย
        </label>
        <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">

        <!-- กรอบแสดงรูปภาพ -->
        <div id="image-container">
            <span id="placeholder-text">รอน้อง AI โหลดเสร็จก่อนน้า ✨</span>
            <img id="previewImage" />
        </div>

        <!-- กล่องสรุปผลลัพธ์ -->
        <div id="resultSummary"></div>

        <!-- รายการเปอร์เซ็นต์แต่ละคลาส -->
        <div id="label-container"></div>
    </div>

    <!-- โหลดไลบรารี TensorFlow.js และ Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        // ⚠️ เช็กตรงนี้: โฟลเดอร์โมเดลต้องชื่อ my_model และอยู่ในที่เดียวกับไฟล์ HTML นี้
        const URL = "./my_model/";

        let model, labelContainer, maxPredictions;
        let isModelReady = false;

        // โหลดโมเดลเมื่อเปิดหน้าเว็บ
        async function init() {
            const statusBadge = document.getElementById("status-badge");
            const uploadBtnLabel = document.getElementById("uploadBtnLabel");
            const placeholder = document.getElementById("placeholder-text");

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                isModelReady = true;

                // เปลี่ยนสถานะเมื่อโหลดสำเร็จ
                statusBadge.style.background = "#d4edda";
                statusBadge.style.color = "#155724";
                statusBadge.style.borderColor = "#c3e6cb";
                statusBadge.innerHTML = "✨ พร้อมใช้งานแล้วค่า!";

                // ปลดล็อกปุ่มอัปโหลด
                uploadBtnLabel.style.opacity = "1";
                uploadBtnLabel.style.pointerEvents = "auto";
                placeholder.innerHTML = "ยังไม่มีรูปภาพเลย<br>กดปุ่มด้านบนเพื่อเลือกนะ ✨";

                // สร้างช่องแสดงผลตามจำนวนคลาสที่เทรดมา
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "prediction-item";
                    itemDiv.innerHTML = `
                        <div class="prediction-header">
                            <span class="class-name">คลาส ${i+1}</span>
                            <span class="class-percent">0%</span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill"></div>
                        </div>
                    `;
                    labelContainer.appendChild(itemDiv);
                }
            } catch (error) {
                console.error("Error loading model:", error);
                statusBadge.style.background = "#f8d7da";
                statusBadge.style.color = "#721c24";
                statusBadge.style.borderColor = "#f5c6cb";
                statusBadge.innerHTML = "❌ โหลดโมเดลไม่สำเร็จ เช็กชื่อโฟลเดอร์ my_model นะคะ";
            }
        }
        
        // เริ่มโหลดโมเดลทันที
        init();

        // ฟังก์ชันจัดการรูปภาพที่อัปโหลด
        async function handleImageUpload(event) {
            if (!isModelReady) {
                alert("กรุณารอสักครู่ กำลังโหลดโมเดลอยู่ค่ะ!");
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            const imageElement = document.getElementById("previewImage");
            const placeholder = document.getElementById("placeholder-text");
            const summaryDiv = document.getElementById("resultSummary");

            // สร้าง URL ชั่วคราวให้รูปแสดงผลบนหน้าจอทันที
            const imageUrl = URL.createObjectURL(file);
            imageElement.src = imageUrl;
            
            imageElement.onload = async function() {
                imageElement.style.display = "block";
                placeholder.style.display = "none";

                summaryDiv.style.display = "block";
                summaryDiv.innerHTML = "🎀 กำลังวิเคราะห์รูปภาพน้า รอแป๊บนึง...";

                try {
                    // ส่งรูปภาพเข้าไปให้โมเดลทำนายผล
                    const prediction = await model.predict(imageElement);
                    
                    let highestProbability = 0;
                    let bestClassName = "";

                    for (let i = 0; i < maxPredictions; i++) {
                        const prob = prediction[i].probability;
                        const className = prediction[i].className;
                        const percent = (prob * 100).toFixed(1);

                        // อัปเดตข้อมูลใน UI แต่ละแถว
                        const itemDiv = labelContainer.childNodes[i];
                        itemDiv.querySelector(".class-name").innerText = className;
                        itemDiv.querySelector(".class-percent").innerText = `${percent}%`;
                        itemDiv.querySelector(".progress-fill").style.width = `${percent}%`;

                        if (prob > highestProbability) {
                            highestProbability = prob;
                            bestClassName = className;
                        }
                    }

                    // สรุปผลลัพธ์ตัวใหญ่ด้านบน
                    summaryDiv.innerHTML = `💖 สรุปแล้วน้องคือ: <u>${bestClassName}</u> (${(highestProbability * 100).toFixed(1)}%)`;
                } catch (err) {
                    console.error("Prediction error:", err);
                    summaryDiv.innerHTML = "❌ เกิดข้อผิดพลาดในการประมวลผลรูปภาพค่ะ";
                }
            };
        }
    </script>
</body>
</html>
